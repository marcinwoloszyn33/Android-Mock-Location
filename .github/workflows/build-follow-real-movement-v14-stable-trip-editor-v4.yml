name: Build Follow Real Movement V14 Stable Trip Editor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout V13
        uses: actions/checkout@v4
        with:
          ref: follow-real-movement-v13
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Create V14 branch from V13
        run: |
          git fetch origin follow-real-movement-v13
          git fetch origin follow-real-movement-v14:refs/remotes/origin/follow-real-movement-v14 || true
          git checkout -B follow-real-movement-v14 origin/follow-real-movement-v13
          git status --short

      - name: RED - confirm V13 editor problems
        run: |
          A="android-studio-project/Mock-my-GPS/src/main/java/com/github/warren_bank/mock_location/ui/TripSimulationActivity.java"
          L="android-studio-project/Mock-my-GPS/src/main/res/layout/activity_trip_simulation.xml"
          grep -q "button_paste_trip_origin" "$A"
          grep -q "reset(origin, destination" "$A"
          grep -q "button_paste_trip_waypoints" "$L"
          echo "RED confirmed: V13 still has paste buttons and resume-driven form reset."


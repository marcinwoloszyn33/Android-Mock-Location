      - name: Run full unit tests
        run: |
          cd android-studio-project
          chmod +x gradlew
          ./gradlew :Mock-my-GPS:testEnglishWithGooglePlayServicesFusedLocationProviderWithBackupRestoreSAFDebugUnitTest --stacktrace | tee ../green-v14-tests.log

      - name: Build V14 GMS and AOSP APKs
        run: |
          cd android-studio-project
          ./gradlew \
            :Mock-my-GPS:assembleEnglishWithGooglePlayServicesFusedLocationProviderWithBackupRestoreSAFDebug \
            :Mock-my-GPS:assembleEnglishWithAospLocationProvidersWithBackupRestoreSAFDebug \
            --stacktrace | tee ../build-v14.log

      - name: Verify V14 integration and preserve V10-V13 behavior
        run: |
          ROOT="android-studio-project/Mock-my-GPS/src/main"
          A="$ROOT/java/com/github/warren_bank/mock_location/ui/TripSimulationActivity.java"
          D="$ROOT/java/com/github/warren_bank/mock_location/service/trip/TripDraftPrefs.java"
          C="$ROOT/java/com/github/warren_bank/mock_location/service/trip/TripWaypointCodec.java"
          S="$ROOT/java/com/github/warren_bank/mock_location/service/LocationService.java"
          M="$ROOT/java/com/github/warren_bank/mock_location/service/looper/LocationThreadManager.java"
          P="$ROOT/java/com/github/warren_bank/mock_location/service/motion/MotionControlPolicy.java"
          G="$ROOT/java/com/github/warren_bank/mock_location/service/trip/TripPathGenerator.java"
          L="$ROOT/res/layout/activity_trip_simulation.xml"

          grep -q "class TripDraftPrefs" "$D"
          grep -q "never overwrite the editor" "$A"
          grep -q "saveDraftFromUi" "$A"
          grep -q "button_update.setVisibility(active ? View.VISIBLE : View.GONE)" "$A"
          grep -q "button_update.setEnabled(active && TripDraftPrefs.isDirty" "$A"
          grep -q "doUpdateTrip" "$A"
          grep -q "ACTION_UPDATE_TRIP" "$S"
          grep -q "processTripUpdateExtras" "$S"

          ! grep -q "ClipboardManager" "$A"
          ! grep -q "button_paste_trip_origin" "$A"
          ! grep -q "button_paste_trip_origin" "$L"
          ! grep -q "button_paste_trip_waypoints" "$L"
          ! grep -q "button_paste_trip_destination" "$L"

          grep -q 'android:id="@+id/input_trip_origin"' "$L"
          grep -q 'android:id="@+id/input_trip_destination"' "$L"
          grep -q 'android:id="@+id/input_trip_waypoints"' "$L"

          grep -q "return started && joystickEnabled && overlayPermissionGranted" "$P"
          grep -q "rebaseTripAfterJoystickLocked" "$M"
          grep -q "TYPE_COUNT = 30" "$G"
          grep -q "MAX_AMPLITUDE_METERS = 100000000d" "$G"
          grep -q "MAX_ABS_WRAPS = 20" "$G"
          grep -q "ACTION_HEARTBEAT" "$S"
          grep -q "setAndAllowWhileIdle" "$S"
          grep -q "TripTimeline.progress" "$M"
          grep -q "TripStartPermissionPolicy.shouldStartImmediately" "$A"

          if grep -Eq "getLastKnownLocation|getCurrentLocation|requestLocationUpdates|FusedLocationProviderClient" "$D" "$C" "$A"; then
            echo "Unexpected real-location reader in V14 editor/parser."
            exit 1
          fi

          echo "V14 stable Trip editor verification passed."

      - name: Commit V14
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-studio-project/Mock-my-GPS/src/main android-studio-project/Mock-my-GPS/src/test
          git commit -m "fix: stabilize Trip editing and persistent waypoint drafts"

      - name: Upload V14 APKs
        uses: actions/upload-artifact@v4
        with:
          name: mock-my-gps-follow-real-movement-v14-stable-trip-editor-apks
          path: android-studio-project/Mock-my-GPS/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Push V14 branch
        run: |
          git push --force-with-lease origin follow-real-movement-v14

      - name: Upload V14 verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: follow-real-movement-v14-stable-trip-editor-verification
          path: |
            green-v14-tests.log
            build-v14.log
          if-no-files-found: warn

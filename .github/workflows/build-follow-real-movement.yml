          manifest = Path("android-studio-project/Mock-my-GPS/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          permission_marker = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          wake_permission = '    <uses-permission android:name="android.permission.WAKE_LOCK" />'
          if wake_permission not in text:
              if permission_marker not in text:
                  raise SystemExit("Could not locate POST_NOTIFICATIONS permission in manifest")
              text = text.replace(
                  permission_marker,
                  permission_marker + "\n\n    <!-- optional aggressive keep-alive -->\n" + wake_permission,
                  1
              )

          if '.ui.LeakCheckActivity' not in text:
              activity_marker = '        <!-- copied from https://github.com/osmandapp/Osmand/blob/2.0.0/OsmAnd/AndroidManifest.xml -->'
              activity = '        <activity\n            android:name=".ui.LeakCheckActivity"\n            android:launchMode="standard"\n            android:exported="false" />\n\n'
              if activity_marker not in text:
                  raise SystemExit("Could not locate activity insertion marker in manifest")
              text = text.replace(activity_marker, activity + activity_marker, 1)

          manifest.write_text(text, encoding="utf-8")
          PY

      - name: GREEN - run unit tests
        run: |
          cd android-studio-project
          ./gradlew :Mock-my-GPS:testEnglishWithGooglePlayServicesFusedLocationProviderWithBackupRestoreSAFDebugUnitTest --stacktrace

      - name: Build GMS and AOSP debug APKs
        run: |
          cd android-studio-project
          ./gradlew \
            :Mock-my-GPS:assembleEnglishWithGooglePlayServicesFusedLocationProviderWithBackupRestoreSAFDebug \
            :Mock-my-GPS:assembleEnglishWithAospLocationProvidersWithBackupRestoreSAFDebug \
            --stacktrace

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: add follow real movement and resilient spoofing"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mock-my-gps-follow-real-movement-apks
          path: android-studio-project/Mock-my-GPS/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Push implementation branch
        run: |
          git push --force-with-lease origin follow-real-movement

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: follow-real-movement-verification
          path: |
            red-follow-real-movement.log
            android-studio-project/Mock-my-GPS/build/reports/tests/**
            android-studio-project/Mock-my-GPS/build/test-results/**
          if-no-files-found: ignore

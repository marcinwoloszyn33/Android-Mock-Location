name: Build Follow Real Movement

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout service branch
        uses: actions/checkout@v4
        with:
          ref: service
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Create isolated implementation branch
        run: |
          git fetch origin service
          git fetch origin follow-real-movement:refs/remotes/origin/follow-real-movement || true
          git checkout -B follow-real-movement origin/service
          git status --short


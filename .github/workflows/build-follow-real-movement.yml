          cd android-studio-project
          chmod +x gradlew
          set +e
          ./gradlew :Mock-my-GPS:testEnglishWithGooglePlayServicesFusedLocationProviderWithBackupRestoreSAFDebugUnitTest --stacktrace > ../red-follow-real-movement.log 2>&1
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "RED PHASE ERROR: tests unexpectedly passed before production code existed."
            tail -n 120 ../red-follow-real-movement.log
            exit 1
          fi

          if ! grep -Eq "GeoMover|HeadingFilter|StepDetector|MockWatchdog|SessionSnapshot|MockLocationFix|EnhancedPrefs" ../red-follow-real-movement.log; then
            echo "RED PHASE ERROR: build failed for an unrelated reason."
            tail -n 160 ../red-follow-real-movement.log
            exit 1
          fi

          echo "RED confirmed: tests fail on the intentionally missing feature classes."
          tail -n 60 ../red-follow-real-movement.log


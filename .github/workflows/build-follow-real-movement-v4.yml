      - name: GREEN - run full unit test task
        run: |
          cd android-studio-project
          ./gradlew :Mock-my-GPS:testEnglishWithGooglePlayServicesFusedLocationProviderWithBackupRestoreSAFDebugUnitTest --stacktrace | tee ../green-v4-tests.log

      - name: Build GMS and AOSP V4 debug APKs
        run: |
          cd android-studio-project
          ./gradlew \
            :Mock-my-GPS:assembleEnglishWithGooglePlayServicesFusedLocationProviderWithBackupRestoreSAFDebug \
            :Mock-my-GPS:assembleEnglishWithAospLocationProvidersWithBackupRestoreSAFDebug \
            --stacktrace | tee ../build-v4.log

      - name: Verify V4 source integration
        run: |
          grep -q "Sensor.TYPE_STEP_DETECTOR" android-studio-project/Mock-my-GPS/src/main/java/com/github/warren_bank/mock_location/service/motion/RelativeMotionTracker.java
          grep -q "MotionControlPolicy.shouldShowJoystick" android-studio-project/Mock-my-GPS/src/main/java/com/github/warren_bank/mock_location/service/looper/LocationThreadManager.java
          grep -q "ACTIVITY_RECOGNITION" android-studio-project/Mock-my-GPS/src/main/AndroidManifest.xml
          grep -q "persistSessionMaybe(SystemClock.elapsedRealtime(), true)" android-studio-project/Mock-my-GPS/src/main/java/com/github/warren_bank/mock_location/service/looper/LocationThreadManager.java
          echo "V4 integration checks passed."

      - name: Commit V4 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-studio-project/Mock-my-GPS/src/main
          git add android-studio-project/Mock-my-GPS/src/test
          git commit -m "feat: improve real movement detection and keep joystick"

      - name: Upload V4 APKs
        uses: actions/upload-artifact@v4
        with:
          name: mock-my-gps-follow-real-movement-v4-apks
          path: android-studio-project/Mock-my-GPS/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Push V4 implementation branch
        run: |
          git push --force-with-lease origin follow-real-movement-v4

      - name: Upload V4 verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: follow-real-movement-v4-verification
          path: |
            red-v4.log
            green-v4-tests.log
            build-v4.log
          if-no-files-found: warn

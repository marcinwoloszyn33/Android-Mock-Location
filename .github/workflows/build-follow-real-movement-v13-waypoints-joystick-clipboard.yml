      - name: GREEN - run full unit tests
        run: |
          cd android-studio-project
          chmod +x gradlew
          ./gradlew :Mock-my-GPS:testEnglishWithGooglePlayServicesFusedLocationProviderWithBackupRestoreSAFDebugUnitTest --stacktrace | tee ../green-v13-tests.log

      - name: Build V13 GMS and AOSP APKs
        run: |
          cd android-studio-project
          ./gradlew \
            :Mock-my-GPS:assembleEnglishWithGooglePlayServicesFusedLocationProviderWithBackupRestoreSAFDebug \
            :Mock-my-GPS:assembleEnglishWithAospLocationProvidersWithBackupRestoreSAFDebug \
            --stacktrace | tee ../build-v13.log

      - name: Verify V13 integration and preserve V12/V10 behavior
        run: |
          ROOT="android-studio-project/Mock-my-GPS/src/main"
          G="$ROOT/java/com/github/warren_bank/mock_location/service/trip/TripPathGenerator.java"
          R="$ROOT/java/com/github/warren_bank/mock_location/service/trip/TripRoutePlan.java"
          C="$ROOT/java/com/github/warren_bank/mock_location/service/trip/TripWaypointCodec.java"
          M="$ROOT/java/com/github/warren_bank/mock_location/service/looper/LocationThreadManager.java"
          S="$ROOT/java/com/github/warren_bank/mock_location/service/LocationService.java"
          A="$ROOT/java/com/github/warren_bank/mock_location/ui/TripSimulationActivity.java"
          P="$ROOT/java/com/github/warren_bank/mock_location/service/motion/MotionControlPolicy.java"
          SNAP="$ROOT/java/com/github/warren_bank/mock_location/service/recovery/SessionSnapshot.java"
          LAYOUT="$ROOT/res/layout/activity_trip_simulation.xml"

          # V13 features.
          grep -q "class TripRoutePlan" "$R"
          grep -q "class TripWaypointCodec" "$C"
          grep -q "remainingWaypointsText" "$R"
          grep -q "TripRoutePlan.getPoint" "$M"
          grep -q "rebaseTripAfterJoystickLocked" "$M"
          grep -q "mTripWaypointsText" "$M"
          grep -q "EXTRA_TRIP_WAYPOINTS" "$S"
          grep -q "tripWaypoints" "$SNAP"
          grep -q "ClipboardManager" "$A"
          grep -q "input_trip_waypoints" "$A"
          grep -q "button_paste_trip_origin" "$LAYOUT"
          grep -q "button_paste_trip_destination" "$LAYOUT"
          grep -q "button_paste_trip_waypoints" "$LAYOUT"
          grep -q "return started && joystickEnabled && overlayPermissionGranted" "$P"

          # No waypoint list = preserve the already-tested V12 geometry path.
          grep -q "preserve V12 behavior" "$R"
          grep -q "TripPathGenerator.getPoint" "$R"

          # Preserve V12 global geometry and V10 reliability/one-click start.
          grep -q "TYPE_COUNT = 30" "$G"
          grep -q "MAX_AMPLITUDE_METERS = 100000000d" "$G"
          grep -q "sanitizeWraps" "$G"
          grep -q "TripTimeline.progress" "$M"
          grep -q "ACTION_HEARTBEAT" "$S"
          grep -q "setAndAllowWhileIdle" "$S"
          grep -q "TripStartPermissionPolicy.shouldStartImmediately" "$A"

          # New route engine must not read the real device location.
          if grep -Eq "getLastKnownLocation|getCurrentLocation|requestLocationUpdates|FusedLocationProviderClient" "$R" "$C"; then
            echo "Unexpected real-location reader in V13 route engine."
            exit 1
          fi

          echo "V13 verification passed."

      - name: Commit V13
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-studio-project/Mock-my-GPS/src/main android-studio-project/Mock-my-GPS/src/test
          git commit -m "feat: add Trip waypoints joystick control and clipboard paste"

      - name: Upload V13 APKs
        uses: actions/upload-artifact@v4
        with:
          name: mock-my-gps-follow-real-movement-v13-waypoints-joystick-clipboard-apks
          path: android-studio-project/Mock-my-GPS/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Push V13 branch
        run: |
          git push --force-with-lease origin follow-real-movement-v13

      - name: Upload V13 verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: follow-real-movement-v13-waypoints-joystick-clipboard-verification
          path: |
            green-v13-tests.log
            build-v13.log
          if-no-files-found: warn

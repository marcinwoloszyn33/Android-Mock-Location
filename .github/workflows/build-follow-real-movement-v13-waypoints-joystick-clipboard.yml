name: Build Follow Real Movement V13 Waypoints Joystick Clipboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout V12
        uses: actions/checkout@v4
        with:
          ref: follow-real-movement-v12
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Create V13 branch from V12
        run: |
          git fetch origin follow-real-movement-v12
          git fetch origin follow-real-movement-v13:refs/remotes/origin/follow-real-movement-v13 || true
          git checkout -B follow-real-movement-v13 origin/follow-real-movement-v12
          git status --short

      - name: RED - confirm V12 lacks V13 features
        run: |
          test ! -f android-studio-project/Mock-my-GPS/src/main/java/com/github/warren_bank/mock_location/service/trip/TripRoutePlan.java
          test ! -f android-studio-project/Mock-my-GPS/src/main/java/com/github/warren_bank/mock_location/service/trip/TripWaypointCodec.java
          grep -q "started && !flyMode && joystickEnabled" android-studio-project/Mock-my-GPS/src/main/java/com/github/warren_bank/mock_location/service/motion/MotionControlPolicy.java
          ! grep -q "input_trip_waypoints" android-studio-project/Mock-my-GPS/src/main/res/layout/activity_trip_simulation.xml
          echo "RED confirmed: V12 has no waypoints, Trip joystick, or clipboard controls."


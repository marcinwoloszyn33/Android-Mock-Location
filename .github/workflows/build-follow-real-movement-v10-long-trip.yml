name: Build Follow Real Movement V10 Long Trip Reliability

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V9
        uses: actions/checkout@v4
        with:
          ref: follow-real-movement-v9
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Create V10 branch
        run: |
          git fetch origin follow-real-movement-v9
          git fetch origin follow-real-movement-v10:refs/remotes/origin/follow-real-movement-v10 || true
          git checkout -B follow-real-movement-v10 origin/follow-real-movement-v9

      - name: RED - add reliability tests
        run: |
          mkdir -p android-studio-project/Mock-my-GPS/src/test/java/com/github/warren_bank/mock_location/service/recovery

          cat > android-studio-project/Mock-my-GPS/src/test/java/com/github/warren_bank/mock_location/service/recovery/TripTimelineTest.java <<'EOF'
          package com.github.warren_bank.mock_location.service.recovery;
          import org.junit.Test;
          import static org.junit.Assert.*;
          public class TripTimelineTest {
              @Test public void elapsedTimeDrivesProgress() {
                  long start = 1000L;
                  long duration = 6L * 60L * 60L * 1000L;
                  assertEquals(1d/3d, TripTimeline.progress(start, duration, start + 2L*60L*60L*1000L), 0.000001d);
                  assertEquals(5d/6d, TripTimeline.progress(start, duration, start + 5L*60L*60L*1000L), 0.000001d);
              }
              @Test public void remainingIsClamped() {
                  assertEquals(2500L, TripTimeline.remainingMillis(1000L, 10000L, 8500L));
                  assertEquals(0L, TripTimeline.remainingMillis(1000L, 10000L, 12000L));
              }
          }
          EOF

          cat > android-studio-project/Mock-my-GPS/src/test/java/com/github/warren_bank/mock_location/service/recovery/LongTripPolicyTest.java <<'EOF'
          package com.github.warren_bank.mock_location.service.recovery;
          import org.junit.Test;
          import static org.junit.Assert.*;
          public class LongTripPolicyTest {
              @Test public void tripAlwaysHoldsWakeLock() {
                  assertTrue(LongTripPolicy.shouldHoldWakeLock(true, true, false));
                  assertFalse(LongTripPolicy.shouldHoldWakeLock(true, false, false));
                  assertTrue(LongTripPolicy.shouldHoldWakeLock(true, false, true));
              }
              @Test public void longGapForcesProviderRecovery() {
                  assertFalse(LongTripPolicy.shouldForceProviderRecovery(9999L));
                  assertTrue(LongTripPolicy.shouldForceProviderRecovery(10000L));
              }
          }
          EOF

          cat > android-studio-project/Mock-my-GPS/src/test/java/com/github/warren_bank/mock_location/service/recovery/SessionSnapshotV10Test.java <<'EOF'
          package com.github.warren_bank.mock_location.service.recovery;
          import org.junit.Test;
          import static org.junit.Assert.*;
          public class SessionSnapshotV10Test {
              @Test public void wallClockEndSurvivesSerialization() {
                  long now = 1700000000000L;
                  long end = now + 3600000L;
                  SessionSnapshot s = new SessionSnapshot(true,52.2d,21.0d,false,0.74d,true,SessionSnapshot.MODE_TRIP,52.3d,21.1d,3600000L,end);
                  SessionSnapshot r = SessionSnapshot.fromJson(s.toJson());
                  assertTrue(r.hasTripRoute());
                  assertEquals(end, r.tripEndWallClockMs);
                  assertEquals(3600000L, r.remainingTripMs(now));
              }
          }
          EOF

      - name: RED - verify tests fail
        run: |
          cd android-studio-project
          chmod +x gradlew
          set +e
          ./gradlew :Mock-my-GPS:testEnglishWithGooglePlayServicesFusedLocationProviderWithBackupRestoreSAFDebugUnitTest --stacktrace > ../red-v10.log 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "RED unexpectedly passed"; cat ../red-v10.log; exit 1
          fi
          grep -Eq "TripTimeline|LongTripPolicy|tripEndWallClockMs" ../red-v10.log

      - name: GREEN - implement V10
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android-studio-project/Mock-my-GPS/src/main/java/com/github/warren_bank/mock_location")
          recovery = root / "service/recovery"

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit("Could not locate " + label)
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          (recovery / "TripTimeline.java").write_text(r'''package com.github.warren_bank.mock_location.service.recovery;
          public final class TripTimeline {
              private TripTimeline() {}
              public static long durationMillis(int seconds) {
                  long safe = Math.max(1L, (long) seconds);
                  return safe > Long.MAX_VALUE / 1000L ? Long.MAX_VALUE : safe * 1000L;
              }
              public static double progress(long start, long duration, long now) {
                  if (duration <= 0L) return 1d;
                  if (now <= start) return 0d;
                  long elapsed = now - start;
                  if (elapsed >= duration) return 1d;
                  return Math.max(0d, Math.min(1d, (double) elapsed / (double) duration));
              }
              public static long remainingMillis(long start, long duration, long now) {
                  if (duration <= 0L) return 0L;
                  if (now <= start) return duration;
                  long elapsed = now - start;
                  return elapsed >= duration ? 0L : duration - elapsed;
              }
              public static long wallClockEnd(long nowWall, long remaining) {
                  if (remaining <= 0L) return nowWall;
                  return nowWall > Long.MAX_VALUE - remaining ? Long.MAX_VALUE : nowWall + remaining;
              }
          }
          ''', encoding="utf-8")

          (recovery / "LongTripPolicy.java").write_text(r'''package com.github.warren_bank.mock_location.service.recovery;
          public final class LongTripPolicy {
              public static final long FORCE_PROVIDER_RECOVERY_GAP_MS = 10000L;
              public static final long HEARTBEAT_INTERVAL_MS = 10L * 60L * 1000L;
              private LongTripPolicy() {}
              public static boolean shouldHoldWakeLock(boolean running, boolean tripActive, boolean aggressive) {
                  return running && (tripActive || aggressive);
              }
              public static boolean shouldForceProviderRecovery(long gapMs) {
                  return gapMs >= FORCE_PROVIDER_RECOVERY_GAP_MS;
              }
          }
          ''', encoding="utf-8")

          (recovery / "SessionSnapshot.java").write_text(r'''package com.github.warren_bank.mock_location.service.recovery;
          import com.google.gson.Gson;
          public final class SessionSnapshot {
              public static final double DEFAULT_STEP_LENGTH_METERS = 0.74d;
              public static final String MODE_FIXED = "FIXED";
              public static final String MODE_FOLLOW_REAL_MOVEMENT = "FOLLOW_REAL_MOVEMENT";
              public static final String MODE_TRIP = "TRIP";
              public final boolean active;
              public final double latitude;
              public final double longitude;
              public final boolean followRealMovement;
              public final double stepLengthMeters;
              public final boolean aggressiveKeepAlive;
              public final String mode;
              public final double tripTargetLatitude;
              public final double tripTargetLongitude;
              public final long tripRemainingMs;
              public final long tripEndWallClockMs;
              public SessionSnapshot(boolean active,double latitude,double longitude,boolean follow,double step,boolean keepAlive) {
                  this(active,latitude,longitude,follow,step,keepAlive,follow ? MODE_FOLLOW_REAL_MOVEMENT : MODE_FIXED);
              }
              public SessionSnapshot(boolean active,double latitude,double longitude,boolean follow,double step,boolean keepAlive,String mode) {
                  this(active,latitude,longitude,follow,step,keepAlive,mode,0d,0d,0L,0L);
              }
              public SessionSnapshot(boolean active,double latitude,double longitude,boolean follow,double step,boolean keepAlive,String mode,double targetLat,double targetLon,long remaining) {
                  this(active,latitude,longitude,follow,step,keepAlive,mode,targetLat,targetLon,remaining,0L);
              }
              public SessionSnapshot(boolean active,double latitude,double longitude,boolean follow,double step,boolean keepAlive,String mode,double targetLat,double targetLon,long remaining,long endWall) {
                  boolean valid = valid(latitude, longitude);
                  this.active = active && valid;
                  this.latitude = valid ? latitude : 0d;
                  this.longitude = valid ? longitude : 0d;
                  this.followRealMovement = this.active && follow;
                  this.stepLengthMeters = sanitizeStep(step);
                  this.aggressiveKeepAlive = this.active && keepAlive;
                  this.mode = sanitizeMode(this.active, this.followRealMovement, mode);
                  boolean trip = this.active && MODE_TRIP.equals(this.mode) && valid(targetLat,targetLon) && (remaining > 0L || endWall > 0L);
                  this.tripTargetLatitude = trip ? targetLat : 0d;
                  this.tripTargetLongitude = trip ? targetLon : 0d;
                  this.tripRemainingMs = trip ? Math.max(0L, remaining) : 0L;
                  this.tripEndWallClockMs = trip ? Math.max(0L, endWall) : 0L;
              }
              public boolean hasTripRoute() {
                  return active && MODE_TRIP.equals(mode) && valid(tripTargetLatitude,tripTargetLongitude) && (tripRemainingMs > 0L || tripEndWallClockMs > 0L);
              }
              public long remainingTripMs(long nowWall) {
                  if (!hasTripRoute()) return 0L;
                  return tripEndWallClockMs > 0L ? Math.max(0L, tripEndWallClockMs - nowWall) : Math.max(0L, tripRemainingMs);
              }
              public boolean hasResumableTrip() {
                  return hasTripRoute() && remainingTripMs(System.currentTimeMillis()) > 0L;
              }
              public static SessionSnapshot inactive() { return new SessionSnapshot(false,0d,0d,false,DEFAULT_STEP_LENGTH_METERS,false,MODE_FIXED); }
              public String toJson() { return new Gson().toJson(this); }
              public static SessionSnapshot fromJson(String json) {
                  if (json == null || json.trim().isEmpty()) return inactive();
                  try {
                      RawSnapshot r = new Gson().fromJson(json, RawSnapshot.class);
                      if (r == null) return inactive();
                      return new SessionSnapshot(r.active,r.latitude,r.longitude,r.followRealMovement,r.stepLengthMeters,r.aggressiveKeepAlive,r.mode,r.tripTargetLatitude,r.tripTargetLongitude,r.tripRemainingMs,r.tripEndWallClockMs);
                  } catch (Exception e) { return inactive(); }
              }
              private static final class RawSnapshot {
                  boolean active; double latitude; double longitude; boolean followRealMovement; double stepLengthMeters; boolean aggressiveKeepAlive; String mode; double tripTargetLatitude; double tripTargetLongitude; long tripRemainingMs; long tripEndWallClockMs;
              }
              private static String sanitizeMode(boolean active, boolean follow, String mode) {
                  if (!active) return MODE_FIXED;
                  if (MODE_TRIP.equals(mode)) return MODE_TRIP;
                  return follow ? MODE_FOLLOW_REAL_MOVEMENT : MODE_FIXED;
              }
              private static double sanitizeStep(double v) {
                  if (!finite(v) || v <= 0d) return DEFAULT_STEP_LENGTH_METERS;
                  return Math.max(0.20d, Math.min(2.00d, v));
              }
              private static boolean valid(double lat, double lon) { return finite(lat) && finite(lon) && lat >= -90d && lat <= 90d && lon >= -180d && lon <= 180d; }
              private static boolean finite(double v) { return !Double.isNaN(v) && !Double.isInfinite(v); }
          }
          ''', encoding="utf-8")

          (root / "service/looper/LocationThread.java").write_text(r'''package com.github.warren_bank.mock_location.service.looper;
          import com.github.warren_bank.mock_location.service.recovery.LongTripPolicy;
          import android.content.Context;
          import android.os.Handler;
          import android.os.HandlerThread;
          import android.os.Process;
          import android.os.SystemClock;
          public class LocationThread extends HandlerThread {
              private Context mContext;
              private LocationThreadManager mLocationThreadManager;
              private int mTimeInterval;
              private Handler mHandler;
              private volatile long mLastRunElapsedMs = 0L;
              public LocationThread(Context context, LocationThreadManager manager, int interval) {
                  super("LocationThread", Process.THREAD_PRIORITY_MORE_FAVORABLE);
                  mContext = context; mLocationThreadManager = manager; mTimeInterval = Math.max(50, interval);
              }
              @Override public synchronized void start() { super.start(); mHandler = new Handler(getLooper()); mHandler.post(mUpdateLocation); }
              public void startThread() { MockLocationProviderManager.startMockingLocation(mContext); start(); }
              public void stopThread() {
                  MockLocationProviderManager.stopMockingLocation();
                  if (mHandler != null) mHandler.removeCallbacksAndMessages(null);
                  try { quit(); interrupt(); } catch (Exception e) {}
                  mLocationThreadManager = null;
              }
              public void updateTimeInterval(int interval) { mTimeInterval = Math.max(50, interval); }
              public void kickNow() {
                  final Handler h = mHandler; if (h == null) return;
                  h.post(new Runnable() { @Override public void run() { Handler current = mHandler; if (current == null) return; current.removeCallbacks(mUpdateLocation); mUpdateLocation.run(); }});
              }
              private final Runnable mUpdateLocation = new Runnable() {
                  @Override public void run() {
                      LocationThreadManager manager = mLocationThreadManager;
                      long now = SystemClock.elapsedRealtime();
                      long gap = (mLastRunElapsedMs > 0L && now >= mLastRunElapsedMs) ? now - mLastRunElapsedMs : 0L;
                      mLastRunElapsedMs = now;
                      try {
                          if (manager != null) {
                              MockLocationFix fix = manager.getUpdateFix();
                              if (LongTripPolicy.shouldForceProviderRecovery(gap)) {
                                  recoverProviders(manager, now, fix);
                              } else {
                                  boolean success = fix != null && MockLocationProviderManager.exec(fix);
                                  manager.onInjectionResult(success, now);
                                  if (manager.shouldRecover(now)) recoverProviders(manager, now, manager.getLastFixForRecovery());
                              }
                          }
                      } catch (Exception e) {
                          manager = mLocationThreadManager;
                          if (manager != null) manager.onInjectionResult(false, SystemClock.elapsedRealtime());
                      } finally {
                          manager = mLocationThreadManager;
                          if (manager != null && manager.shouldContinue() && mHandler != null) mHandler.postDelayed(this, mTimeInterval);
                      }
                  }
              };
              private void recoverProviders(LocationThreadManager manager, long now, MockLocationFix fix) {
                  manager.markRecoveryStarted(now);
                  boolean success = false;
                  try {
                      MockLocationProviderManager.stopMockingLocation();
                      MockLocationProviderManager.startMockingLocation(mContext);
                      success = fix != null && MockLocationProviderManager.exec(fix);
                  } catch (Exception e) { success = false; }
                  long done = SystemClock.elapsedRealtime();
                  manager.onInjectionResult(success, done);
                  if (success) manager.markRecoverySucceeded(done);
              }
              public Handler getHandler() { return mHandler; }
          }
          ''', encoding="utf-8")

